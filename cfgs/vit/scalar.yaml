CORRUPTION:
  DATASET: cifar10
  SEVERITY:
  - 5
  TYPE:
    - gaussian_noise
    - shot_noise
    - impulse_noise
    - defocus_blur
    - glass_blur
    - motion_blur
    - zoom_blur
    - snow
    - frost
    - fog
    - brightness
    - contrast
    - elastic_transform
    - pixelate
    - jpeg_compression
MODEL:
  ADAPTATION: scalar
  ARCH: Standard_VITB
OPTIM:
  BETA: 0.9
  LR: 1e-05 #1e-05
  METHOD: SGD
  STEPS: 1
  WD: 0.0
  EMA_ATT: 0.9 # 0.9 #0.9 #0.999 cifar100 0.9 cifar10
  EMA_WEIGH: 0.99 #0.99 0.99 for cifar100 and cifar10
TEST:
  BATCH_SIZE: 8 #8 #4 cifar 8 imagenet

    #imagenet: LR=1e-5, EMA_WEIGH=0.9,EMA_ATT=0.99,B==8
